<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Twister · Solana Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<style>
:root{
  --bg0:#0b0e1a; --bg1:#161c2e;
  --purple:#9945ff; --purple-2:#7a2bdd;
  --red:#e74c3c; --blue:#3498db; --green:#2ecc71; --yellow:#f1c40f;
  --ink:#d6defa; --ink-dim:#8892c0; --line:#242c46;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:linear-gradient(145deg,var(--bg0) 0%,#151a2b 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:'Inter',sans-serif;padding:1.25rem;color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.game-card{
  max-width:640px;width:100%;
  background:rgba(22,28,46,.72);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.06);border-radius:2.25rem;
  padding:1.75rem 1.75rem 2rem;
  box-shadow:0 30px 60px -24px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.05);
}

/* header */
.header{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.5rem}
.brand{display:flex;align-items:center;gap:.55rem}
.brand i{font-size:1.7rem;color:var(--purple);filter:drop-shadow(0 0 10px rgba(153,69,255,.35))}
.brand h1{font-weight:800;font-size:1.5rem;letter-spacing:-.5px;
  background:linear-gradient(135deg,#f0f3ff,#b9bfff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.wallet-wrap{display:flex;align-items:center;gap:.5rem}
.wallet-btn{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  padding:.55rem 1.1rem;border-radius:60px;color:var(--ink);font-weight:600;font-size:.82rem;
  display:flex;align-items:center;gap:.5rem;cursor:pointer;transition:.2s}
.wallet-btn i{color:var(--purple)}
.wallet-btn:hover{background:rgba(153,69,255,.15);border-color:#9945ff55}
.wallet-tag{font-size:.72rem;color:var(--ink-dim);font-weight:500;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* scoreboard */
.scoreboard{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem;margin:1.1rem 0 .4rem;
}
.stat{
  background:#101624;border:1px solid var(--line);border-radius:1rem;
  padding:.6rem .5rem;text-align:center;
}
.stat .label{font-size:.62rem;letter-spacing:.6px;color:var(--ink-dim);font-weight:600;margin-bottom:.15rem}
.stat .value{font-size:1.35rem;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;line-height:1}
.stat.timer .value{color:var(--yellow)}
.stat.timer.danger .value{color:#ff6b6b}

/* the call */
.call{
  margin:1rem 0 .9rem;background:#0d1220;border:1px solid var(--line);
  border-radius:1.25rem;padding:1rem 1.1rem;display:flex;align-items:center;gap:.9rem;min-height:4.6rem;
}
.call .limb{
  width:3.2rem;height:3.2rem;flex:0 0 auto;border-radius:.9rem;
  display:flex;align-items:center;justify-content:center;font-size:1.5rem;
  background:#161d30;border:1px solid var(--line);color:#cdd6f7}
.call .text{flex:1}
.call .text .lead{font-size:.72rem;letter-spacing:.5px;color:var(--ink-dim);font-weight:600;margin-bottom:.15rem}
.call .text .instruction{font-size:1.05rem;font-weight:700;line-height:1.25}
.call .swatch{font-weight:800;text-transform:capitalize}
.swatch.red{color:#ff7a6d}.swatch.blue{color:#5fb0ee}.swatch.green{color:#57e090}.swatch.yellow{color:#f6d24b}
.call.waiting .instruction{color:var(--ink-dim);font-weight:600}

/* mat */
.mat{
  display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;
  padding:.9rem;background:#0c1120;border:1px solid var(--line);border-radius:1.5rem;
}
.dot{
  aspect-ratio:1/1;border-radius:50%;cursor:pointer;position:relative;
  border:3px solid transparent;transition:transform .08s ease,box-shadow .15s ease,filter .15s ease;
  filter:saturate(.92) brightness(.92);
}
.dot::after{content:"";position:absolute;inset:22%;border-radius:50%;background:rgba(255,255,255,.14)}
.dot.red{background:var(--red)}.dot.blue{background:var(--blue)}.dot.green{background:var(--green)}.dot.yellow{background:var(--yellow)}
.dot:hover{filter:saturate(1) brightness(1.05)}
.dot:active{transform:scale(.92)}
.dot.target{
  filter:saturate(1.1) brightness(1.12);
  box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 22px 2px rgba(255,255,255,.35);
  animation:pulse 1.1s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 18px 0 rgba(255,255,255,.25)}50%{box-shadow:0 0 0 3px #fff,0 0 30px 6px rgba(255,255,255,.55)}}
.dot.hit{animation:hit .35s ease}
@keyframes hit{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.dot.miss{animation:miss .35s ease}
@keyframes miss{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* controls */
.controls{display:flex;align-items:center;justify-content:center;gap:.9rem;margin:1.2rem 0 .4rem}
.play-btn{
  background:linear-gradient(135deg,var(--purple),var(--purple-2));border:1px solid #b07aff55;
  padding:.95rem 2.4rem;border-radius:80px;font-weight:800;font-size:1.1rem;color:#fff;
  display:inline-flex;align-items:center;gap:.65rem;cursor:pointer;
  box-shadow:0 8px 24px rgba(153,69,255,.3);transition:.15s;letter-spacing:.3px}
.play-btn:hover{transform:translateY(-1px);box-shadow:0 12px 32px #9945ff55}
.play-btn:active{transform:translateY(0) scale(.98)}
.play-btn.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink);box-shadow:none}
.play-btn.ghost:hover{background:rgba(255,255,255,.08);transform:none;box-shadow:none}

/* status */
.status{text-align:center;margin-top:.9rem;color:var(--ink-dim);font-weight:500;font-size:.9rem;min-height:1.3rem}
.status strong{color:var(--ink)}
.best{ text-align:center;margin-top:.4rem;font-size:.78rem;color:#4a5578}
.best b{color:#7d8ac0}

/* overlay */
.overlay{
  position:fixed;inset:0;background:rgba(6,9,18,.82);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:1.5rem;z-index:20}
.overlay.show{display:flex}
.panel{
  max-width:400px;width:100%;background:linear-gradient(180deg,#1a2038,#141a2c);
  border:1px solid rgba(255,255,255,.08);border-radius:1.75rem;padding:2rem 1.75rem;text-align:center;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
.panel .big{font-size:2rem;font-weight:800;margin-bottom:.35rem}
.panel .sub{color:var(--ink-dim);font-size:.92rem;margin-bottom:1.25rem;line-height:1.4}
.panel .final-score{font-size:3.4rem;font-weight:800;color:var(--yellow);line-height:1;margin:.4rem 0 .1rem;font-variant-numeric:tabular-nums}
.panel .final-label{font-size:.72rem;letter-spacing:1px;color:var(--ink-dim);text-transform:uppercase;margin-bottom:1.3rem}
.panel .row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}

/* leaderboard */
.lb{margin-top:1.3rem;text-align:left;border-top:1px solid var(--line);padding-top:1rem}
.lb h3{font-size:.72rem;letter-spacing:.8px;color:var(--ink-dim);font-weight:700;margin-bottom:.6rem;text-transform:uppercase}
.lb ol{list-style:none;display:flex;flex-direction:column;gap:.35rem}
.lb li{display:flex;align-items:center;justify-content:space-between;font-size:.85rem;padding:.35rem .5rem;border-radius:.5rem}
.lb li.me{background:rgba(153,69,255,.14);border:1px solid #9945ff33}
.lb .who{display:flex;align-items:center;gap:.5rem;color:var(--ink);font-weight:500;overflow:hidden}
.lb .rank{color:var(--ink-dim);font-weight:700;width:1.2rem;flex:0 0 auto}
.lb .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .pts{color:var(--yellow);font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto}
.lb .empty{color:#4a5578;font-size:.82rem;padding:.3rem .5rem}

.footer-note{text-align:center;margin-top:1.5rem;color:#3b4468;font-size:.76rem;border-top:1px solid #1f2742;padding-top:1.3rem}
.footer-note i{color:var(--purple);margin:0 3px}

@media (max-width:480px){
  .game-card{padding:1.35rem}
  .brand h1{font-size:1.25rem}
  .mat{gap:.5rem;padding:.7rem}
  .call .instruction{font-size:.95rem}
  .stat .value{font-size:1.2rem}
  .play-btn{padding:.85rem 1.8rem;font-size:1rem}
}
</style>
</head>
<body>
<div class="game-card">
  <div class="header">
    <div class="brand"><i class="fas fa-circle-notch"></i><h1>twister</h1></div>
    <div class="wallet-wrap">
      <span class="wallet-tag" id="walletTag">Playing as Guest</span>
      <button class="wallet-btn" id="walletBtn"><i class="fas fa-plug"></i> Connect</button>
    </div>
  </div>

  <div class="scoreboard">
    <div class="stat"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
    <div class="stat"><div class="label">STREAK</div><div class="value" id="streak">0</div></div>
    <div class="stat timer" id="timerStat"><div class="label">TIME</div><div class="value" id="timer">—</div></div>
  </div>

  <div class="call waiting" id="call">
    <div class="limb" id="callLimb"><i class="fas fa-hand-peace"></i></div>
    <div class="text">
      <div class="lead">THE CALL</div>
      <div class="instruction" id="callText">Press Play to start</div>
    </div>
  </div>

  <div class="mat" id="mat"></div>

  <div class="controls">
    <button class="play-btn" id="playBtn"><i class="fas fa-play"></i> Play</button>
  </div>

  <div class="status" id="status">Guest mode — tap the glowing dot before the timer runs out.</div>
  <div class="best">Your best: <b id="bestScore">0</b></div>

  <div class="footer-note"><i class="fas fa-bolt"></i> built for pump.fun · Solana twister</div>
</div>

<!-- game over overlay -->
<div class="overlay" id="overlay">
  <div class="panel">
    <div class="big" id="panelTitle">Time's up!</div>
    <div class="sub" id="panelSub">You tangled up.</div>
    <div class="final-score" id="finalScore">0</div>
    <div class="final-label">final score</div>
    <div class="row">
      <button class="play-btn" id="againBtn"><i class="fas fa-rotate-right"></i> Play again</button>
    </div>
    <div class="lb">
      <h3><i class="fas fa-trophy" style="color:var(--yellow)"></i> Leaderboard</h3>
      <ol id="lbList"></ol>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

const COLORS=['red','blue','green','yellow'];
const LIMBS=[
  {name:'left hand', icon:'fa-hand'},
  {name:'right hand', icon:'fa-hand'},
  {name:'left foot', icon:'fa-shoe-prints'},
  {name:'right foot', icon:'fa-shoe-prints'}
];
const MAT_SIZE=16;               // 4x4
const START_TIME=4.0;            // seconds per call
const MIN_TIME=1.4;              // floor as it speeds up
const SPEEDUP=0.12;              // seconds shaved each correct hit
const HIT_BONUS_MAX=100;         // points for an instant tap
const LB_KEY='twister_lb_v1';
const BEST_KEY='twister_best_v1';

// DOM
const mat=document.getElementById('mat');
const scoreEl=document.getElementById('score');
const streakEl=document.getElementById('streak');
const timerEl=document.getElementById('timer');
const timerStat=document.getElementById('timerStat');
const callEl=document.getElementById('call');
const callText=document.getElementById('callText');
const callLimb=document.getElementById('callLimb');
const playBtn=document.getElementById('playBtn');
const statusEl=document.getElementById('status');
const bestEl=document.getElementById('bestScore');
const walletBtn=document.getElementById('walletBtn');
const walletTag=document.getElementById('walletTag');
const overlay=document.getElementById('overlay');
const finalScoreEl=document.getElementById('finalScore');
const panelTitle=document.getElementById('panelTitle');
const panelSub=document.getElementById('panelSub');
const againBtn=document.getElementById('againBtn');
const lbList=document.getElementById('lbList');

// State
let matColors=[];
let target=null;
let score=0, streak=0;
let timeLeft=START_TIME, callTime=START_TIME;
let ticking=null, running=false;
let wallet=null;
let playerName='Guest';

const rand=a=>a[Math.floor(Math.random()*a.length)];

function buildMat(){
  matColors=[];
  mat.innerHTML='';
  for(let i=0;i<MAT_SIZE;i++){
    const c=rand(COLORS);
    matColors.push(c);
    const d=document.createElement('div');
    d.className='dot '+c;
    d.dataset.i=i;
    d.addEventListener('click',()=>onTap(i,d));
    mat.appendChild(d);
  }
}

function newCall(){
  // choose a limb + a color that actually exists on the mat
  const limb=rand(LIMBS);
  const cell=Math.floor(Math.random()*MAT_SIZE);
  const color=matColors[cell];
  target={cell,color,limb};

  // highlight one specific dot of that color as the target
  document.querySelectorAll('.dot').forEach(d=>d.classList.remove('target'));
  mat.children[cell].classList.add('target');

  callEl.classList.remove('waiting');
  callLimb.innerHTML='<i class="fas '+limb.icon+'"></i>';
  callText.innerHTML=limb.name.charAt(0).toUpperCase()+limb.name.slice(1)+
    ' on <span class="swatch '+color+'">'+color+'</span>';

  callTime=Math.max(MIN_TIME,START_TIME-streak*SPEEDUP);
  timeLeft=callTime;
  renderTimer();
}

function renderTimer(){
  timerEl.textContent=timeLeft.toFixed(1);
  timerStat.classList.toggle('danger',timeLeft<=1.3);
}

function startTick(){
  clearInterval(ticking);
  const step=0.1;
  ticking=setInterval(()=>{
    timeLeft=Math.max(0,timeLeft-step);
    renderTimer();
    if(timeLeft<=0){ clearInterval(ticking); gameOver('timeout'); }
  },100);
}

function onTap(i,dot){
  if(!running) return;
  if(i===target.cell){
    // score: base + speed bonus
    const bonus=Math.round(HIT_BONUS_MAX*(timeLeft/callTime));
    score+=10+bonus;
    streak++;
    dot.classList.remove('miss'); dot.classList.add('hit');
    setTimeout(()=>dot.classList.remove('hit'),350);
    scoreEl.textContent=score;
    streakEl.textContent=streak;
    statusEl.innerHTML=streak>=3?'<strong>'+streak+' in a row!</strong> Speeding up…':'Nice — keep going.';
    newCall();
    startTick();
  }else{
    // wrong dot = tangled up, game over
    dot.classList.add('miss');
    setTimeout(()=>dot.classList.remove('miss'),350);
    gameOver('wrong',i);
  }
}

function startGame(){
  score=0; streak=0; running=true;
  scoreEl.textContent='0'; streakEl.textContent='0';
  overlay.classList.remove('show');
  buildMat();
  newCall();
  startTick();
  playBtn.innerHTML='<i class="fas fa-stop"></i> Stop';
  statusEl.innerHTML='Tap the <strong>glowing dot</strong>. Faster taps score more.';
}

function stopGame(){
  running=false;
  clearInterval(ticking);
  document.querySelectorAll('.dot').forEach(d=>d.classList.remove('target'));
  callEl.classList.add('waiting');
  callLimb.innerHTML='<i class="fas fa-hand-peace"></i>';
  callText.textContent='Press Play to start';
  timerEl.textContent='—';
  timerStat.classList.remove('danger');
  playBtn.innerHTML='<i class="fas fa-play"></i> Play';
}

function gameOver(reason){
  running=false;
  clearInterval(ticking);
  document.querySelectorAll('.dot').forEach(d=>d.classList.remove('target'));
  playBtn.innerHTML='<i class="fas fa-play"></i> Play';

  if(reason==='timeout'){ panelTitle.textContent="Time's up!"; panelSub.textContent='You hesitated on '+target.limb.name+'.'; }
  else { panelTitle.textContent='Tangled up!'; panelSub.textContent='Wrong dot — the call was '+target.color+'.'; }

  finalScoreEl.textContent=score;
  saveScore(score);
  renderLeaderboard();
  updateBest();
  overlay.classList.add('show');
}

/* ---- persistence: best + leaderboard (works for guests too) ---- */
function getBest(){ return parseInt(localStorage.getItem(BEST_KEY)||'0',10); }
function updateBest(){
  const b=Math.max(getBest(),score);
  localStorage.setItem(BEST_KEY,String(b));
  bestEl.textContent=b;
}
function loadLB(){
  try{ return JSON.parse(localStorage.getItem(LB_KEY)||'[]'); }catch(e){ return []; }
}
function saveScore(pts){
  if(pts<=0) return;
  const lb=loadLB();
  lb.push({name:playerName,pts,guest:!wallet,t:Date.now()});
  lb.sort((a,b)=>b.pts-a.pts);
  localStorage.setItem(LB_KEY,JSON.stringify(lb.slice(0,10)));
}
function renderLeaderboard(){
  const lb=loadLB();
  lbList.innerHTML='';
  if(!lb.length){ lbList.innerHTML='<li class="empty">No scores yet — you could be #1.</li>'; return; }
  lb.forEach((e,idx)=>{
    const li=document.createElement('li');
    const isMe=(e.pts===score && e.name===playerName && Date.now()-e.t<4000);
    if(isMe) li.className='me';
    li.innerHTML='<span class="who"><span class="rank">'+(idx+1)+'</span>'+
      '<span class="name">'+(e.guest?'<i class="fas fa-user" style="color:#6b7aa3;font-size:.7rem"></i> ':'<i class="fas fa-wallet" style="color:var(--purple);font-size:.7rem"></i> ')+
      escapeHtml(e.name)+'</span></span><span class="pts">'+e.pts+'</span>';
    lbList.appendChild(li);
  });
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---- wallet: optional. Guests never blocked. ---- */
function toggleWallet(){
  if(wallet){
    wallet=null; playerName='Guest';
    walletTag.textContent='Playing as Guest';
    walletBtn.innerHTML='<i class="fas fa-plug"></i> Connect';
    walletBtn.style.borderColor='rgba(255,255,255,.08)';
  }else{
    // Simulated connect. Swap for @solana/wallet-adapter in production.
    const addr='8xP'+Math.random().toString(36).substring(2,6).toUpperCase()+'…'+Math.random().toString(36).substring(2,4).toUpperCase();
    wallet=addr; playerName=addr;
    walletTag.textContent=addr;
    walletBtn.innerHTML='<i class="fas fa-check-circle" style="color:var(--green)"></i> '+addr.slice(0,6);
    walletBtn.style.borderColor='#2ecc7155';
  }
}

// wire up
playBtn.addEventListener('click',()=>{ running?stopGame():startGame(); });
againBtn.addEventListener('click',startGame);
walletBtn.addEventListener('click',toggleWallet);
overlay.addEventListener('click',e=>{ if(e.target===overlay) overlay.classList.remove('show'); });

// init (idle board so it looks alive before playing)
buildMat();
bestEl.textContent=getBest();
})();
</script>
</body>
</html>
